[package]
name = "timenc"
version = "3.1.0"
edition = "2021"
authors = ["TimENC Contributors"]
description = "Secure file encryption with ChaCha20-Poly1305 and Argon2id"
license = "GPL-3.0"
repository = "https://github.com/SnowTimSwiss/TimENC"
keywords = ["encryption", "chacha20", "argon2", "security", "cli"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "timenc"
path = "src/lib.rs"

[[bin]]
name = "timenc"
path = "src/main.rs"

[dependencies]
# Cryptography
chacha20poly1305 = "0.10"
# "zeroize" wipes the Argon2 working memory (256 MiB - 1 GiB of password-derived
# blocks) when a derivation finishes, instead of leaving it to the allocator.
argon2 = { version = "0.5", features = ["zeroize"] }
# Keyed BLAKE2b is the PRF behind the v6 subkey schedule. Argon2id is already
# built on BLAKE2b, so this is a direct dependency on code that was in the
# trust base (and in the lockfile) either way - no new supply-chain surface.
blake2 = "0.10"
# Constant-time comparison for the v6 key-commitment tag.
subtle = "2.6"
rand = "0.8"
zeroize = "1.7"

# Compression
zstd = "0.13"

# CLI
clap = { version = "4.4", features = ["derive"] }
# Reads passwords from the terminal without echoing them.
rpassword = "7"

# Utilities
thiserror = "2"
tar = "0.4"
tempfile = "3.10"
dirs = "5.0"

[target.'cfg(unix)'.dependencies]
# Core-dump and ptrace hardening (src/hardening.rs).
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "TimENC Contributors"
copyright = "2024, TimENC Contributors"
license-file = ["LICENSE", "4"]
extended-description = """\
TimENC is a modern, cross-platform encryption tool.
It uses ChaCha20-Poly1305 AEAD encryption and Argon2id \
key derivation for strong, authenticated encryption."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/timenc", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/timenc/", "644"],
]

# Optimise debug and test builds. The tests run Argon2id (256 MiB) and
# ChaCha20-Poly1305 over megabytes of data many times, which is unusably slow at
# opt-level 0. Dependencies get full optimisation; the crate's own code a light
# one, so it still debugs reasonably.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
