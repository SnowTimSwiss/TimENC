app-id: io.github.SnowTimSwiss.TimENC
# The GUI draws itself with OpenGL and needs no toolkit, so the plain
# freedesktop runtime is enough (the GNOME runtime was only needed for
# WebKitGTK).
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# Rust toolchain is provided by an SDK extension rather than the build host,
# so the build is fully reproducible inside the Flatpak sandbox.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: timenc-gui

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # File encryption operates on the user's own files: reading the input,
  # writing the .timenc output beside it, and securely deleting the original.
  # These sibling-file operations go beyond what the file-chooser portal
  # grants, so broad home access is required.
  - --filesystem=home

build-options:
  # rust-stable extension lands its toolchain here.
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    # Cargo's vendored registry (populated by cargo-sources.json) lives under
    # the module build directory; the offline build resolves all crates here.
    CARGO_HOME: /run/build/timenc/cargo

modules:
  - name: timenc
    buildsystem: simple
    build-commands:
      # Build the GUI from source, fully offline against vendored crates.
      - cargo --offline build --release --manifest-path gui/Cargo.toml
      - install -Dm755 gui/target/release/timenc-gui /app/bin/timenc-gui
      # Desktop entry + AppStream metadata (named after the app-id, as Flatpak requires)
      - install -Dm644 packaging/linux/io.github.SnowTimSwiss.TimENC.desktop /app/share/applications/io.github.SnowTimSwiss.TimENC.desktop
      - install -Dm644 packaging/linux/io.github.SnowTimSwiss.TimENC.metainfo.xml /app/share/metainfo/io.github.SnowTimSwiss.TimENC.metainfo.xml
      # MIME type for *.timenc (named after the app-id so Flatpak exports it),
      # without which the desktop never associates the files with TimENC
      - install -Dm644 packaging/linux/timenc-mime.xml /app/share/mime/packages/io.github.SnowTimSwiss.TimENC.xml
      # Icons into the hicolor theme, renamed to the app-id
      - install -Dm644 packaging/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.SnowTimSwiss.TimENC.png
      - install -Dm644 packaging/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.SnowTimSwiss.TimENC.png
      - install -Dm644 packaging/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.SnowTimSwiss.TimENC.png
    sources:
      # For CI and local builds this copies the working checkout. For the Flathub
      # submission, replace this block with a pinned git source (see
      # flatpak/FLATHUB.md) -- Flathub requires type: git with tag + commit.
      - type: dir
        path: ..
      # Vendored Cargo registry generated from gui/Cargo.lock by
      # flatpak/generate-cargo-sources.py. Regenerate after any dependency change.
      - cargo-sources.json
