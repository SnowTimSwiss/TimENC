name: Build and Release Packages

# On a published release: builds every package and attaches it to the release.
# On a push that touches the GUI or the packaging: builds the same packages as
# a check, and uploads nothing. Nothing is ever kept in GitHub Actions storage.

on:
  release:
    types: [published]
  push:
    paths:
      - 'gui/**'
      - 'packaging/**'
      - '.github/workflows/release-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    # The oldest supported runner, so the packages run on older glibc versions
    # too (Debian 12, Ubuntu 22.04, RHEL 9 and newer). No system libraries are
    # needed to build: X11, Wayland and OpenGL are loaded at run time.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Read the version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build the GUI and the command-line tool
        run: |
          cargo build --release --locked --manifest-path gui/Cargo.toml
          cargo build --release --bin timenc

      - name: Install packaging tools
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          # appimagetool checks the desktop entry with it.
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils

      - name: Build packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          (cd gui && cargo deb --no-build -o "../dist/TimENC_${VERSION}_amd64.deb")
          (cd gui && cargo generate-rpm -o "../dist/TimENC-${VERSION}-1.x86_64.rpm")
          packaging/linux/build-appimage.sh "$VERSION" dist
          ls -la dist

      - name: Upload to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build the GUI
        run: cargo build --release --locked --manifest-path gui/Cargo.toml

      - name: Build the installer and the portable executable
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.event.release.tag_name || 'check' }}
        run: |
          mkdir -p dist
          exe="$(cygpath -w "$PWD/gui/target/release/timenc-gui.exe")"
          out="$(cygpath -w "$PWD/dist/TimENC_${VERSION}_x64-setup.exe")"
          choco install nsis -y --no-progress
          "/c/Program Files (x86)/NSIS/makensis.exe" -V2 "-DVERSION=$VERSION" "-DEXE=$exe" "-DOUTFILE=$out" packaging/windows/installer.nsi
          cp gui/target/release/timenc-gui.exe "dist/TimENC-portable-${TAG}.exe"
          ls -la dist

      - name: Upload to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Read the version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build the GUI
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked --manifest-path gui/Cargo.toml

      - name: Build the disk image
        run: |
          packaging/macos/build-dmg.sh "${{ steps.version.outputs.version }}" dist
          ls -la dist

      - name: Upload to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  build-flatpak:
    # The push check for the Flatpak runs in flatpak.yml.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Builds from source (offline, vendored crates) -- the same manifest used
      # for Flathub, so the released .flatpak matches what Flathub would ship.
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: TimENC-${{ github.event.release.tag_name }}.flatpak
          manifest-path: flatpak/io.github.SnowTimSwiss.TimENC.yml
          # Everything goes straight to the release below; nothing is kept in
          # GitHub Actions storage.
          cache: false
          upload-artifact: false

      - name: Upload Flatpak Asset
        uses: softprops/action-gh-release@v2
        with:
          files: TimENC-${{ github.event.release.tag_name }}.flatpak
