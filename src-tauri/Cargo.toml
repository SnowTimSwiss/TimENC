[package]
name = "timenc-tauri"
version = "3.2.0"
description = "TimENC - Secure Encryption GUI"
authors = ["TimENC Contributors"]
license = "GPL-3.0"
repository = "https://github.com/SnowTimSwiss/TimENC"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
timenc = { path = ".." }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already part of the dependency tree (Tauri's window is a GTK window); used to
# make the title bar follow the desktop's dark mode (src/theme.rs).
gtk = "0.18"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
